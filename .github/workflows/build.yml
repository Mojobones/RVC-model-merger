name: Build standalone binaries

# Builds Windows and Linux binaries from the same source and spec file on
# GitHub's own runners. Neither maintainer machine has a Linux/WSL environment
# to build or test the Linux artifact directly, so this workflow's Ubuntu run
# is the actual build+import verification for that platform, not just CI.
on:
  workflow_dispatch: {}          # manual "Run workflow" button, for testing
  release:
    types: [published]           # auto-attach both platforms to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: RVC-Model-Merger-win64
            archive_ext: zip
          - os: ubuntu-latest
            asset_name: RVC-Model-Merger-linux-x64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Ubuntu's setup-python build does not reliably include a working Tk;
      # install the system Tcl/Tk dev package so `import tkinter` succeeds.
      - name: Install system Tk and a virtual display (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb

      # CPU-only wheel: this app never touches the GPU (merges run on CPU
      # tensors regardless of what produced the checkpoints), and pulling the
      # CUDA build would roughly double the artifact size for no benefit.
      - name: Install CPU-only torch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 tkinterdnd2==0.6.2 pyinstaller

      - name: Verify tkinter and tkinterdnd2 are importable
        run: python -c "import tkinter; import tkinterdnd2; print('tk ok:', tkinter.TkVersion)"

      - name: Build
        run: pyinstaller MergeModels.spec --clean --noconfirm

      - name: Verify the frozen build actually launches (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python .github/workflows/smoke_test.py dist/RVC-Model-Merger/RVC-Model-Merger

      - name: Verify the frozen build actually launches (Windows)
        if: runner.os == 'Windows'
        run: python .github/workflows/smoke_test.py dist/RVC-Model-Merger/RVC-Model-Merger.exe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/RVC-Model-Merger -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset_name }}.tar.gz" -C dist RVC-Model-Merger

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
